[project]
name = "catastro-litio-noa"
version = "0.0.1"
description = "Ingesta, estandarizacion y monitoreo de los catastros mineros de Jujuy, Salta y Catamarca."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "pandas>=2.2",
    "openpyxl>=3.1",  # el geoserver de Catamarca esta detras de Cloudflare
    "pyarrow>=17",
    "streamlit>=1.57",
    "pydeck>=0.9.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
